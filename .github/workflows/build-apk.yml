name: Criar APK BedrockAI V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Adicionar abertura nativa do Minecraft
        shell: bash
        run: |
          JAVA_DIR="android/app/src/main/java/com/bedrockai/app"
          mkdir -p "$JAVA_DIR"
          mkdir -p android/app/src/main/res/xml

          cat > "$JAVA_DIR/MainActivity.java" <<'JAVA'
          package com.bedrockai.app;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MinecraftOpenerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

          cat > "$JAVA_DIR/MinecraftOpenerPlugin.java" <<'JAVA'
          package com.bedrockai.app;

          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ComponentName;
          import android.content.Intent;
          import android.net.Uri;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          import java.io.FileOutputStream;

          @CapacitorPlugin(name = "MinecraftOpener")
          public class MinecraftOpenerPlugin extends Plugin {
              @PluginMethod
              public void openAddon(PluginCall call) {
                  String base64 = call.getString("base64");
                  String filename = call.getString("filename");
                  if (base64 == null || base64.isEmpty()) {
                      call.reject("Arquivo do Add-On está vazio.");
                      return;
                  }
                  if (filename == null || filename.isEmpty()) filename = "bedrockai.mcaddon";
                  if (!filename.endsWith(".mcaddon")) filename += ".mcaddon";
                  try {
                      byte[] bytes = Base64.decode(base64, Base64.DEFAULT);
                      File dir = new File(getContext().getCacheDir(), "minecraft_addons");
                      if (!dir.exists() && !dir.mkdirs()) throw new Exception("Falha ao criar pasta temporária.");
                      File file = new File(dir, filename);
                      try (FileOutputStream out = new FileOutputStream(file)) {
                          out.write(bytes);
                          out.flush();
                      }
                      Uri uri = FileProvider.getUriForFile(
                              getContext(), getContext().getPackageName() + ".fileprovider", file);
                      getContext().grantUriPermission(
                              "com.mojang.minecraftpe", uri, Intent.FLAG_GRANT_READ_URI_PERMISSION);

                      Intent direct = new Intent(Intent.ACTION_VIEW);
                      direct.setComponent(new ComponentName(
                              "com.mojang.minecraftpe", "com.mojang.minecraftpe.MainActivity"));
                      direct.setData(uri);
                      direct.setClipData(ClipData.newRawUri("Minecraft Add-On", uri));
                      direct.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          getActivity().startActivity(direct);
                          call.resolve();
                          return;
                      } catch (Exception ignored) {}

                      Intent byPackage = new Intent(Intent.ACTION_VIEW);
                      byPackage.setPackage("com.mojang.minecraftpe");
                      byPackage.setDataAndType(uri, "application/octet-stream");
                      byPackage.setClipData(ClipData.newRawUri("Minecraft Add-On", uri));
                      byPackage.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      try {
                          getActivity().startActivity(byPackage);
                          call.resolve();
                          return;
                      } catch (ActivityNotFoundException ignored) {}

                      Intent fallback = new Intent(Intent.ACTION_VIEW);
                      fallback.setDataAndType(uri, "application/octet-stream");
                      fallback.setClipData(ClipData.newRawUri("Minecraft Add-On", uri));
                      fallback.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_ACTIVITY_NEW_TASK);
                      getActivity().startActivity(Intent.createChooser(fallback, "Abrir Add-On com"));
                      call.resolve();
                  } catch (Exception e) {
                      call.reject("Não foi possível abrir o Add-On: " + e.getMessage(), e);
                  }
              }
          }
          JAVA

          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
          </paths>
          XML

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          provider = '''
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          '''
          if ".fileprovider" not in s:
              s = s.replace("</application>", provider + "\n    </application>")
          p.write_text(s)
          PY

      - name: Compilar APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Enviar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: BedrockAI-V6-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
